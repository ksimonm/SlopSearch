name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"   # weekly: the suite must still match the reference
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: servers/go/go.mod
      - name: Go
        working-directory: servers/go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w"; exit 1; }
          go vet ./...
          go build ./...
      - name: Rust
        working-directory: servers/rust
        # the Rust server still carries dead-code warnings, so warnings don't fail CI
        run: cargo clippy --release --locked

  # Pass rate per test file; informational, does not fail the build.
  score:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [go, rust]
    steps:
      - uses: actions/checkout@v5
      - run: make ${{ matrix.server }}-score | tee score.txt
      - name: Summary
        run: |
          { echo "### ${{ matrix.server }}"; echo '```'; cat score.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: score-${{ matrix.server }}
          path: .score/${{ matrix.server }}/

  # The suite is the spec: every test must pass against real OpenSearch.
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check whether tests changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" != pull_request ] \
             || git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(tests/|requirements.txt|pytest.ini|compose.yaml)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        run: make ref-test
      - if: always() && steps.changed.outputs.run == 'true'
        run: docker compose logs opensearch | tail -200
