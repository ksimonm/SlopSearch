name: Compatibility gap
description: SlopenSearch answers differently from OpenSearch 3.9.0
labels: [compatibility]
body:
  - type: dropdown
    id: server
    attributes:
      label: Server
      options: [Go, Rust, Both]
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request
      description: The exact request, e.g. as a curl command.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What OpenSearch 3.9.0 answers
      description: Status code and body from the reference (`make ref-up`, port 9290).
      render: json
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What SlopenSearch answers
      render: json
    validations:
      required: true
